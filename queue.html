<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WITHU | Modern Queue Display</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #F4F6F8;
            --surface: #FFFFFF;
            --primary: #0F172A;
            --secondary: #64748B;
            --border: #E2E8F0;
            --success: #10B981;
            --success-light: #ECFDF5;
            --success-border: #A7F3D0;
            --accent: #3B82F6;
            --gray-light: #F8FAFC;
            --gray-mute: #F1F5F9;
            
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-xl: 32px;
            --radius-pill: 9999px;
            
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.02);
            --shadow-md: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.025);
            --shadow-float: 0 20px 25px -5px rgba(0,0,0,0.05), 0 10px 10px -5px rgba(0,0,0,0.02);
            
            --font-head: 'Plus Jakarta Sans', 'Prompt', sans-serif;
            --font-body: 'Inter', 'Prompt', sans-serif;
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--bg); 
            color: var(--primary); 
            font-family: var(--font-body); 
            height: 100vh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column;
            letter-spacing: -0.01em; 
            -webkit-font-smoothing: antialiased;
        }

        /* --- Header --- */
        .top-bar {
            height: 100px;
            padding: 0 48px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-logo img {
            width: 48px;
            height: 48px;
            border-radius: 12px;
        }

        .brand-name {
            font-family: var(--font-head);
            font-size: 24px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .clock {
            font-family: var(--font-head);
            font-size: 20px;
            font-weight: 700;
            color: var(--secondary);
            background: var(--surface);
            padding: 10px 24px;
            border-radius: var(--radius-pill);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
        }

        /* --- Kanban Board --- */
        .kanban-board {
            flex-grow: 1;
            display: flex;
            gap: 40px;
            padding: 0 48px 48px 48px;
        }

        .kanban-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            overflow: hidden;
            position: relative;
        }

        /* Column Headers */
        .column-header {
            padding: 32px 40px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            z-index: 10;
        }

        .column-title {
            font-family: var(--font-head);
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--primary);
        }

        .ready .column-title {
            color: var(--success);
        }

        .badge-count {
            background: var(--gray-mute);
            color: var(--secondary);
            padding: 8px 20px;
            border-radius: var(--radius-pill);
            font-family: var(--font-head);
            font-size: 20px;
            font-weight: 800;
        }

        .ready .badge-count {
            background: var(--success);
            color: #FFFFFF;
        }

        /* Column Content */
        .column-content {
            padding: 40px;
            overflow-y: auto;
            flex-grow: 1;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            align-content: flex-start;
            background: var(--gray-light);
        }

        .column-content::-webkit-scrollbar { display: none; }

        /* --- Bill Card Design --- */
        .bill-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            animation: slideUp 0.4s ease-out;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
        }

        .bill-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .bill-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px dashed var(--border);
        }

        .table-badge {
            font-family: var(--font-head);
            font-size: 22px;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-badge::before {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
        }

        .ready .table-badge::before {
            background: var(--success);
        }

        .item-count {
            font-size: 14px;
            color: var(--secondary);
            font-weight: 600;
            background: var(--gray-mute);
            padding: 6px 12px;
            border-radius: var(--radius-pill);
        }

        /* Bill Items List */
        .bill-items {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .bill-item {
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        .item-qty {
            background: var(--gray-mute);
            padding: 6px;
            border-radius: 8px;
            color: var(--primary);
            font-weight: 700;
            font-size: 16px;
            min-width: 36px;
            text-align: center;
            line-height: 1;
        }

        .item-details {
            flex-grow: 1;
        }

        .item-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
            line-height: 1.3;
        }

        .item-note {
            display: block;
            font-size: 14px;
            color: var(--secondary);
            font-weight: 400;
            margin-top: 4px;
        }

        /* Animations */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .blink { animation: blinkAnim 1.5s infinite; }
        @keyframes blinkAnim {
            0%, 100% { transform: scale(1); box-shadow: var(--shadow-sm); border-color: var(--success-border); }
            50% { transform: scale(1.03); box-shadow: 0 15px 30px rgba(16, 185, 129, 0.15); border-color: var(--success); }
        }

    </style>
</head>
<body>

    <!-- Top Header -->
    <div class="top-bar">
        <div class="brand-logo">
            <img src="https://img1.pic.in.th/images/-------2.png" alt="Logo">
            <div class="brand-name">WITHU CAFE</div>
        </div>
        <div class="clock" id="clock-display">00:00:00</div>
    </div>

    <!-- Kanban Board -->
    <div class="kanban-board">
        
        <!-- Preparing Column -->
        <div class="kanban-column prep">
            <div class="column-header">
                <div class="column-title">กำลังจัดเตรียม</div>
                <div class="badge-count" id="prep-count">0</div>
            </div>
            <div class="column-content" id="prep-list">
                <!-- Data goes here -->
            </div>
        </div>

        <!-- Ready Column -->
        <div class="kanban-column ready">
            <div class="column-header">
                <div class="column-title">พร้อมรับ</div>
                <div class="badge-count" id="ready-count">0</div>
            </div>
            <div class="column-content" id="ready-list">
                <!-- Data goes here -->
            </div>
        </div>

    </div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzo3GGk0RBYAX_q4kYmYcONV2a639J-4TXoggQHGtRjtTaK7DdPz5KcrMwXK6wtSinPnA/exec";
    
    let previousReady = [];
    let isMuted = true;

    // --- Clock Setup ---
    function updateClock() {
        const now = new Date();
        document.getElementById('clock-display').innerText = now.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- Audio Logic ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    
    function playDingDong() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        playTone(659.25, 0, 0.4); // E5
        playTone(523.25, 0.4, 0.8); // C5
    }

    function playTone(freq, startTimeOffset, duration) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        gain.gain.setValueAtTime(0, now + startTimeOffset);
        gain.gain.linearRampToValueAtTime(0.5, now + startTimeOffset + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.01, now + startTimeOffset + duration);
        osc.start(now + startTimeOffset);
        osc.stop(now + startTimeOffset + duration);
    }

    document.body.addEventListener('click', () => {
        if(isMuted) {
            isMuted = false;
            if (!audioCtx) audioCtx = new AudioContext();
            audioCtx.resume();
            
            let toast = document.createElement('div');
            toast.innerText = "ระบบเสียงพร้อมทำงาน";
            toast.style.position = 'fixed';
            toast.style.bottom = '40px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.background = 'var(--primary)';
            toast.style.color = '#fff';
            toast.style.padding = '12px 32px';
            toast.style.borderRadius = 'var(--radius-pill)';
            toast.style.fontFamily = 'var(--font-head)';
            toast.style.fontWeight = '700';
            toast.style.boxShadow = 'var(--shadow-float)';
            toast.style.zIndex = '9999';
            toast.style.transition = 'opacity 0.5s ease';
            document.body.appendChild(toast);
            setTimeout(()=>toast.style.opacity='0', 2000);
            setTimeout(()=>toast.remove(), 2500);
        }
    }, {once:true});

    // --- Queue Data Fetching ---
    async function fetchQueue() {
        try {
            const res = await fetch(API_URL + "?action=getAdminData&ts=" + Date.now());
            const data = await res.json();
            if (!data.orders) return;

            let tables = {};
            data.orders.forEach(o => {
                let t = o.table.toString();
                if (!tables[t]) tables[t] = { table: t, statuses: [], items: [] };
                
                if (o.status !== 'ยกเลิก') {
                    tables[t].statuses.push(o.status);
                    tables[t].items.push({
                        qty: o.qty,
                        menu: o.menu,
                        details: o.details,
                        status: o.status
                    });
                }
            });

            let readyBills = [];
            let prepBills = [];

            Object.values(tables).forEach(t => {
                if (t.items.length === 0) return;
                
                // ถ้ารายการทั้งหมดถูก mark ว่า completed ให้ซ่อนจากบอร์ด
                if (t.statuses.every(s => s === 'completed' || s === 'สำเร็จ')) return;
                
                let isReady = t.statuses.every(s => s === 'รอเสิร์ฟ' || s === 'completed' || s === 'สำเร็จ');
                
                if (isReady) readyBills.push(t);
                else prepBills.push(t);
            });

            // เรียงลำดับตามตัวอักษร/เลขคิว
            readyBills.sort((a,b)=>a.table.localeCompare(b.table));
            prepBills.sort((a,b)=>a.table.localeCompare(b.table));

            let currentReadyTables = readyBills.map(b => b.table);
            let newReady = currentReadyTables.filter(x => !previousReady.includes(x));
            if (newReady.length > 0 && !isMuted) {
                playDingDong();
            }
            previousReady = currentReadyTables;

            // ฟังก์ชันสร้างการ์ดบิล
            const renderBillCard = (bill, isReadyZone) => {
                const totalItems = bill.items.reduce((s,i)=>s+parseInt(i.qty),0);
                const isNew = newReady.includes(bill.table) && isReadyZone;
                
                let itemsHtml = bill.items.map(i => {
                    let detailsHtml = (i.details && i.details !== '-') ? `<span class="item-note">${i.details}</span>` : '';
                    return `
                    <div class="bill-item">
                        <div class="item-qty">${i.qty}</div>
                        <div class="item-details">
                            <div class="item-name">${i.menu}</div>
                            ${detailsHtml}
                        </div>
                    </div>`;
                }).join('');

                return `
                <div class="bill-card ${isNew ? 'blink' : ''}">
                    <div class="bill-header">
                        <div class="table-badge">Table ${bill.table}</div>
                        <div class="item-count">${totalItems} items</div>
                    </div>
                    <div class="bill-items">
                        ${itemsHtml}
                    </div>
                </div>`;
            };

            // อัปเดต UI
            document.getElementById('ready-count').innerText = readyBills.length;
            document.getElementById('ready-list').innerHTML = readyBills.map(b => renderBillCard(b, true)).join('');

            document.getElementById('prep-count').innerText = prepBills.length;
            document.getElementById('prep-list').innerHTML = prepBills.map(b => renderBillCard(b, false)).join('');

        } catch(e) {
            console.error("Queue fetch error:", e);
        }
    }

    // Init
    fetchQueue();
    setInterval(fetchQueue, 3000);

</script>
</body>
</html>
