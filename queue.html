<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WITHU | Premium Queue Display</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg: #FAFAFA;
            --surface: #FFFFFF;
            --primary: #111111;
            --secondary: #666666;
            --border: #ECECEC;
            --gold: #C9A86A;
            --success: #16A34A;
            --gray-light: #F9F9F9;
            
            --radius-md: 18px;
            --radius-lg: 24px;
            --radius-xl: 28px;
            --radius-pill: 100px;
            
            --shadow-soft: 0 8px 30px rgba(0, 0, 0, 0.03);
            --shadow-float: 0 24px 48px rgba(0, 0, 0, 0.08);
            
            --font-head: 'Plus Jakarta Sans', 'Prompt', sans-serif;
            --font-body: 'Inter', 'Prompt', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--primary); font-family: var(--font-body); height: 100vh; overflow: hidden; display: flex; letter-spacing: -0.01em; }

        /* --- Left Side: Kanban Board --- */
        .kanban-board {
            width: 70%;
            height: 100%;
            display: flex;
            padding: 24px;
            gap: 24px;
            background: var(--bg);
        }

        .kanban-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .column-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            z-index: 10;
        }

        .column-title {
            font-family: var(--font-head);
            font-size: 24px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge-count {
            background: var(--gray-light);
            color: var(--secondary);
            padding: 6px 16px;
            border-radius: var(--radius-pill);
            font-size: 16px;
            font-weight: 700;
        }

        .column-content {
            padding: 24px;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: var(--gray-light);
        }
        
        .column-content::-webkit-scrollbar { display: none; }

        /* --- Bill Card Design --- */
        .bill-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow-soft);
            border: 1px solid var(--border);
            animation: slideUp 0.4s ease-out;
            transition: all 0.3s;
        }

        .bill-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px dashed var(--border);
        }

        .table-pill {
            background: var(--primary);
            color: #fff;
            padding: 8px 20px;
            border-radius: var(--radius-pill);
            font-family: var(--font-head);
            font-size: 18px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-pill.ready {
            background: var(--success);
            box-shadow: 0 4px 15px rgba(22, 163, 74, 0.3);
        }

        .item-count {
            font-size: 14px;
            color: var(--secondary);
            font-weight: 600;
        }

        .bill-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bill-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 16px;
            font-weight: 600;
        }

        .item-qty {
            background: var(--gray-light);
            padding: 4px 10px;
            border-radius: 8px;
            color: var(--primary);
            font-weight: 800;
            min-width: 38px;
            text-align: center;
        }

        .item-details {
            flex-grow: 1;
        }

        .item-name {
            color: var(--primary);
        }

        .item-note {
            display: block;
            font-size: 13px;
            color: var(--secondary);
            font-weight: 400;
            margin-top: 2px;
        }

        .item-status-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            background: #fef3c7;
            color: #b45309;
            margin-left: 8px;
            font-weight: 600;
        }

        .item-status-tag.done {
            background: #dcfce7;
            color: #166534;
        }

        /* --- Right Side: Media --- */
        .media-side {
            width: 30%;
            height: 100%;
            padding: 24px 24px 24px 0;
            display: flex;
            flex-direction: column;
        }

        .banner-container { 
            width: 100%; 
            flex-grow: 1;
            position: relative; 
            border-radius: var(--radius-xl); 
            overflow: hidden; 
            box-shadow: var(--shadow-float); 
            background: var(--surface); 
        }
        
        .banner-wrapper { 
            display: flex; 
            width: 100%; 
            height: 100%; 
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); 
        }
        
        .banner-slide { 
            min-width: 100%; 
            height: 100%; 
            position: relative; 
        }
        
        .banner-slide img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }
        
        .banner-dots { 
            position: absolute; 
            bottom: 24px; 
            left: 50%;
            transform: translateX(-50%);
            display: flex; 
            gap: 8px; 
            z-index: 10; 
        }
        
        .banner-dot { 
            width: 8px; 
            height: 8px; 
            border-radius: 50%; 
            background: rgba(255,255,255,0.4); 
            transition: var(--transition); 
        }
        
        .banner-dot.active { 
            background: #ffffff; 
            width: 24px; 
            border-radius: 4px; 
        }

        .brand-footer {
            margin-top: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-soft);
        }

        .brand-footer img { width: 36px; height: 36px; border-radius: 10px; }
        .brand-footer h2 { font-family: var(--font-head); font-size: 18px; font-weight: 800; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .blink { animation: blinkAnim 1.5s infinite; }
        @keyframes blinkAnim {
            0%, 100% { transform: scale(1); box-shadow: var(--shadow-soft); border-color: var(--border); }
            50% { transform: scale(1.02); box-shadow: 0 12px 30px rgba(22, 163, 74, 0.2); border-color: var(--success); }
        }

    </style>
</head>
<body>

    <!-- Left Kanban -->
    <div class="kanban-board">
        
        <!-- Preparing Column -->
        <div class="kanban-column">
            <div class="column-header">
                <div class="column-title">
                    <span style="font-size:28px;">🍳</span> กำลังจัดเตรียม
                </div>
                <div class="badge-count" id="prep-count">0</div>
            </div>
            <div class="column-content" id="prep-list">
                <!-- Bills go here -->
            </div>
        </div>

        <!-- Ready Column -->
        <div class="kanban-column">
            <div class="column-header">
                <div class="column-title">
                    <span style="font-size:28px;">🛍️</span> พร้อมรับ
                </div>
                <div class="badge-count" id="ready-count" style="background:var(--success); color:#fff;">0</div>
            </div>
            <div class="column-content" id="ready-list" style="background:#f0fdf4;">
                <!-- Bills go here -->
            </div>
        </div>

    </div>

    <!-- Right Media -->
    <div class="media-side">
        <div class="banner-container">
            <div class="banner-wrapper" id="banner-track"></div>
            <div class="banner-dots" id="banner-dots"></div>
        </div>
        
        <div class="brand-footer">
            <img src="https://img1.pic.in.th/images/-------2.png" alt="Logo">
            <h2>WITHU CAFE</h2>
        </div>
    </div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzo3GGk0RBYAX_q4kYmYcONV2a639J-4TXoggQHGtRjtTaK7DdPz5KcrMwXK6wtSinPnA/exec";
    
    let previousReady = [];
    let isMuted = true;

    // --- Banner Logic ---
    let currentBannerIndex = 0;
    let bannerSliderInterval = null;

    async function loadBanners() {
        try {
            const res = await fetch('https://withu-da97c-default-rtdb.asia-southeast1.firebasedatabase.app/banners.json');
            let data = await res.json();
            
            let defaultBanners = [
                "https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?q=80&w=1920&auto=format&fit=crop",
                "https://img1.pic.in.th/images/eiei-3.md.png"
            ];
            let targetBanners = (data && data.length > 0) ? data : defaultBanners;

            const track = document.getElementById("banner-track");
            const dotsContainer = document.getElementById("banner-dots");
            
            track.innerHTML = targetBanners.map(url => `<div class="banner-slide"><img src="${url}" loading="lazy" alt="Banner"></div>`).join('');
            dotsContainer.innerHTML = targetBanners.map((_, i) => `<div class="banner-dot ${i===0?'active':''}"></div>`).join('');
            
            if (bannerSliderInterval) clearInterval(bannerSliderInterval);
            if (targetBanners.length > 1) { 
                bannerSliderInterval = setInterval(autoSlideBanners, 5000); 
            }
        } catch(e) { console.warn("Failed to load banners", e); }
    }

    function autoSlideBanners() { 
        const slides = document.querySelectorAll(".banner-slide"); 
        if (slides.length === 0) return; 
        currentBannerIndex = (currentBannerIndex + 1) % slides.length; 
        const track = document.getElementById("banner-track"); 
        const dots = document.querySelectorAll(".banner-dot");
        if (track) track.style.transform = `translateX(-${currentBannerIndex * 100}%)`;
        dots.forEach((dot, idx) => dot.classList.toggle("active", idx === currentBannerIndex));
    }

    // --- Audio Logic ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    
    function playDingDong() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        playTone(659.25, 0, 0.4); // E5
        playTone(523.25, 0.4, 0.8); // C5
    }

    function playTone(freq, startTimeOffset, duration) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        gain.gain.setValueAtTime(0, now + startTimeOffset);
        gain.gain.linearRampToValueAtTime(0.5, now + startTimeOffset + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.01, now + startTimeOffset + duration);
        osc.start(now + startTimeOffset);
        osc.stop(now + startTimeOffset + duration);
    }

    document.body.addEventListener('click', () => {
        if(isMuted) {
            isMuted = false;
            if (!audioCtx) audioCtx = new AudioContext();
            audioCtx.resume();
            
            let toast = document.createElement('div');
            toast.innerText = "🔊 ระบบเสียงพร้อมทำงาน";
            toast.style.position = 'fixed';
            toast.style.bottom = '30px';
            toast.style.right = '30px';
            toast.style.background = 'var(--primary)';
            toast.style.color = '#fff';
            toast.style.padding = '12px 24px';
            toast.style.borderRadius = 'var(--radius-pill)';
            toast.style.fontFamily = 'var(--font-head)';
            toast.style.fontWeight = '700';
            toast.style.boxShadow = 'var(--shadow-float)';
            toast.style.zIndex = '9999';
            document.body.appendChild(toast);
            setTimeout(()=>toast.style.opacity='0', 2500);
            setTimeout(()=>toast.remove(), 3000);
        }
    }, {once:true});

    // --- Queue Data Fetching ---
    async function fetchQueue() {
        try {
            const res = await fetch(API_URL + "?action=getAdminData&ts=" + Date.now());
            const data = await res.json();
            if (!data.orders) return;

            let tables = {};
            data.orders.forEach(o => {
                let t = o.table.toString();
                if (!tables[t]) tables[t] = { table: t, statuses: [], items: [] };
                
                // Ignore globally completed or cancelled at item level if we wanted to filter, 
                // but let's just push active/cooking/serving.
                if (o.status !== 'ยกเลิก') {
                    tables[t].statuses.push(o.status);
                    tables[t].items.push({
                        qty: o.qty,
                        menu: o.menu,
                        details: o.details,
                        status: o.status
                    });
                }
            });

            let readyBills = [];
            let prepBills = [];

            Object.values(tables).forEach(t => {
                // If table has no items left, skip
                if (t.items.length === 0) return;
                
                // If every item is completed, skip showing on Kanban entirely? 
                // Wait, if it's "สำเร็จ" we might still want to show it as "Ready" briefly until admin clears it? 
                // Actually, "รอเสิร์ฟ" (Serving) is Ready. "สำเร็จ" (Completed) means they took it.
                if (t.statuses.every(s => s === 'completed' || s === 'สำเร็จ')) return;
                
                let isReady = t.statuses.every(s => s === 'รอเสิร์ฟ' || s === 'completed' || s === 'สำเร็จ');
                
                if (isReady) readyBills.push(t);
                else prepBills.push(t);
            });

            // Sort by table
            readyBills.sort((a,b)=>a.table.localeCompare(b.table));
            prepBills.sort((a,b)=>a.table.localeCompare(b.table));

            let currentReadyTables = readyBills.map(b => b.table);
            let newReady = currentReadyTables.filter(x => !previousReady.includes(x));
            if (newReady.length > 0 && !isMuted) {
                playDingDong();
            }
            previousReady = currentReadyTables;

            // Render Function
            const renderBillCard = (bill, isReadyZone) => {
                const totalItems = bill.items.reduce((s,i)=>s+parseInt(i.qty),0);
                const isNew = newReady.includes(bill.table) && isReadyZone;
                
                let itemsHtml = bill.items.map(i => {
                    let stTag = '';
                    if (!isReadyZone) {
                        if (i.status === 'รอเสิร์ฟ') stTag = '<span class="item-status-tag done">เสร็จแล้ว</span>';
                        else if (i.status === 'กำลังทำ') stTag = '<span class="item-status-tag">กำลังทำ</span>';
                    }
                    let detailsHtml = (i.details && i.details !== '-') ? `<span class="item-note">${i.details}</span>` : '';
                    
                    return `
                    <div class="bill-item">
                        <div class="item-qty">${i.qty}</div>
                        <div class="item-details">
                            <div class="item-name">${i.menu} ${stTag}</div>
                            ${detailsHtml}
                        </div>
                    </div>`;
                }).join('');

                return `
                <div class="bill-card ${isNew ? 'blink' : ''}">
                    <div class="bill-header">
                        <div class="table-pill ${isReadyZone ? 'ready' : ''}">
                            โต๊ะ ${bill.table}
                        </div>
                        <div class="item-count">${totalItems} รายการ</div>
                    </div>
                    <div class="bill-items">
                        ${itemsHtml}
                    </div>
                </div>`;
            };

            // Inject
            document.getElementById('ready-count').innerText = readyBills.length;
            document.getElementById('ready-list').innerHTML = readyBills.map(b => renderBillCard(b, true)).join('');

            document.getElementById('prep-count').innerText = prepBills.length;
            document.getElementById('prep-list').innerHTML = prepBills.map(b => renderBillCard(b, false)).join('');

        } catch(e) {
            console.error("Queue fetch error:", e);
        }
    }

    // Init
    loadBanners();
    fetchQueue();
    setInterval(fetchQueue, 3000);

</script>
</body>
</html>
